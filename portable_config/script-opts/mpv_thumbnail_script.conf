# =================================================================
# SEEKBAR THUMBNAIL PREVIEWS — DISABLED
# =================================================================
# The thumbnailer client is compiled into osc_tethys.lua and cannot be
# removed without patching that 200KB vendored file. These two options
# switch it off completely instead:
#
#   autogenerate=no      -> start_worker_jobs() is never called, so no
#                           slave mpv processes are ever spawned
#   disable_keybinds=yes -> releases the "T" key Tethys would otherwise grab
#
# The companion worker script (mpv_thumbnail_script_server.lua) has been
# deleted, so even a stray job would have nothing to run.
# =================================================================
autogenerate=no
disable_keybinds=yes
