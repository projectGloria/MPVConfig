# =================================================================
# QUALITY MENU  —  F6 (video)  /  Alt+w (audio)
# =================================================================
# Script: portable_config/scripts/quality-menu.lua
#
# HOW IT WORKS
# Picking an entry sets file-local-options/ytdl-format and reloads the URL in
# place (playback position is restored). yt-dlp then requests THAT stream from
# YouTube — mpv is never asked to rescale a higher-resolution stream down.
# Select 480p and a real 480p stream is fetched off the network.
#
# ---------------------------------------------------------------------------
# SYNTAX WARNING — the two quality_strings_* lines below must be BARE JSON.
#
# quality-menu.lua feeds the option value straight to utils.parse_json():
#     local json, error = utils.parse_json(option_string)
# The [[ ]] you see around these lists in quality-menu.lua's own defaults is
# LUA long-bracket string syntax. It has no meaning in a .conf file — writing
#     quality_strings_video=[[{"1080p": "..."}]]
# yields the JSON [[ {...} ]], an array wrapping an array, and the menu ends up
# with a single entry labelled "1" whose format id is a table. Silent, and the
# menu is unusable. Keep these as a plain top-level JSON array: [{...},{...}]
# ---------------------------------------------------------------------------
#
# WHY THE VIDEO ENTRIES CARRY NO "+bestaudio"
# quality-menu builds the final selector as <video pick> .. "+" .. <audio pick>
# (format_string() in quality-menu.lua). A video entry that already contains
# its own "+bestaudio" produces a three-stream selector such as
#     bestvideo[height<=1080]+bestaudio+bestaudio
# so video entries stay video-only and the audio list supplies the other half.
# =================================================================

# NOTE: fetch_formats=no is NOT sufficient on its own. mpv's ytdl_hook hands
# quality-menu the full yt-dlp JSON for free via the property
# user-data/mpv/ytdl/json-subprocess-result, and the script's observer for that
# property used to cache the real format list unconditionally -- which made
# menu_open() skip the curated list below and show every available format.
# scripts/quality-menu.lua carries a local patch (search "LOCAL PATCH") that
# makes that observer respect fetch_formats. If you ever replace the script with
# an upstream copy, the long list comes back until you re-apply the patch.
#
# Use this fixed list rather than querying yt-dlp for every video.
# Set to yes to instead see each video's REAL available formats (exact codecs,
# bitrates and format ids), at the cost of a 1-3s yt-dlp call the first time
# you open the menu on a new URL.
fetch_formats=no

# Trim the curated list to what the video really has, so a 4K upload stops
# offering an 8K entry. mpv's ytdl_hook already hands the script yt-dlp's
# JSON for free; with fetch_formats=no the patched observer scans it for the
# highest "height" it mentions, and menu_open() drops every entry above that.
# No extra yt-dlp call and no waiting -- the JSON has long arrived by the time
# the menu can be opened. Set to no to always show all eight entries.
#
# Caveat: the scan reads every "height" in the JSON, including thumbnail
# heights. Those top out at 1080 on YouTube, so they can only pad the list
# on a sub-1080p video -- never on 1440p and up, and the extra entries still
# resolve to the best stream that exists rather than failing.
filter_by_available=yes

quality_strings_video=[{"4320p  8K": "bestvideo[height<=4320]"},{"2160p  4K": "bestvideo[height<=2160]"},{"1440p  2K": "bestvideo[height<=1440]"},{"1080p": "bestvideo[height<=1080]"},{"720p": "bestvideo[height<=720]"},{"480p": "bestvideo[height<=480]"},{"360p": "bestvideo[height<=360]"},{"240p": "bestvideo[height<=240]"}]
quality_strings_audio=[{"Best audio": "bestaudio"},{"Opus": "bestaudio[acodec^=opus]"},{"128k or lower": "bestaudio[abr<=128]/bestaudio"},{"64k or lower": "bestaudio[abr<=64]/bestaudio"}]

# Keyboard / mouse controls
up_binding=UP WHEEL_UP
down_binding=DOWN WHEEL_DOWN
select_binding=ENTER MBTN_LEFT
close_menu_binding=ESC MBTN_RIGHT

# ---------------------------------------------------------------------------
# APPEARANCE
#
# Backslashes here are LITERAL -- this is a .conf file, not Lua source, so ASS
# override tags take ONE backslash (\fs20), unlike the doubled form (\\fs20)
# the same tags need inside quality-menu.lua string literals.
#
# Row prefixes are appended verbatim into the ASS line, so they can carry their
# own override tags. Every prefix therefore sets \1c itself, so each row opens
# with its own colour instead of inheriting the previous row's:
#   \1c&H07C1FF&  amber = the row the cursor is on
#   \1c&HE6E6E6&  white = the format currently playing
#   \1c&H8A8A8A&  grey  = everything else
# ASS colours are &HBBGGRR&, so &H07C1FF& is RGB #FFC107.
#
# Spacing uses \h (ASS hard space), not literal spaces: mpv's option parser
# strips trailing whitespace from .conf values, which would silently collapse
# the marker alignment.
# ---------------------------------------------------------------------------

# Base style for the list. quality-menu.lua parses font_size back out of this
# \fs value and uses it for row height and scrolling, so keep \fs numeric.
style_ass_tags={\fnMontserrat ExtraBold\fs20\bord1.6\shad0.6\3c&H101010&}

selected_and_active={\1c&H07C1FF&}▶\h✓\h
selected_and_inactive={\1c&H07C1FF&}▶\h\h\h
unselected_and_active={\1c&HE6E6E6&}\h\h✓\h
unselected_and_inactive={\1c&H8A8A8A&}\h\h\h\h

# Title above the list and key hints below it. Both are LOCAL ADDITIONS to
# quality-menu.lua -- upstream has neither. Set these to no for the bare list.
show_header=yes
show_hints=yes
header_ass_tags={\fs14\bord1.4\1c&H07C1FF&\3c&H101010&}
hint_ass_tags={\fs12\bord1.2\1c&H8A8A8A&\3c&H101010&}
hint_text=↑ ↓  move      ENTER  select      ESC  close

# center = list floats in the middle of the screen.
# bottom = original placement, just above the OSC.
menu_position=center

shift_x=0
shift_y=0
text_padding_x=5
text_padding_y=8
scale_playlist_by_window=yes

# Dim the video behind the menu so the list is the only thing competing for
# attention. 0 disables the curtain entirely.
curtain_opacity=0.55
menu_timeout=12

start_with_menu=no
include_unknown=no
hide_identical_columns=yes
