# Browser cookies (logged-in Firefox session) for the sites listed in domains=.
# Sites not listed stay anonymous. A failed cookie load retries without cookies.
enabled=yes
browser=auto
browser_priority=firefox
# Leave blank for automatic selection, or enter YOUR Firefox profile name.
firefox_profile=
# Comma-separated: youtube, twitch, kick, or all. Add youtube if videos need login.
domains=twitch,kick
fallback_on_failure=yes
notify=yes
