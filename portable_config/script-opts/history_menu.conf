# Maximum number of history records retained. Old thumbnails are deleted when pruned.
max_entries=300

# Design resolution used for UI scale. Cards and fonts shrink on smaller windows.
design_width=1280
design_height=720

# Clamp scale so cards never become unreadably tiny or huge.
min_scale=0.55
max_scale=1.25

# Max simultaneous ffmpeg thumbnail generation jobs.
max_thumb_jobs=2
