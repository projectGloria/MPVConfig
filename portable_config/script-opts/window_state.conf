# =================================================================
# WINDOW STATE (window_state.lua)
# =================================================================
# Single authority for size, position, fullscreen restore, multi-monitor.

# Preferred size when no saved state exists (percentage of screen).
default_autofit=70%x70%

# Center on first open if no saved geometry.
default_geometry=50%:50%

# Delay after leaving fullscreen before restoring windowed geometry (seconds).
fs_settle=0.12

# Poll interval for display-count changes (seconds). Set 0 to disable.
display_poll=2.0

# Delay used when re-applying locked size after file load.
lock_delay=0.18

# Persist always-on-top and border across sessions.
persist_ontop=yes
persist_border=yes
