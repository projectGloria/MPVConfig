# =================================================================
# SEEKBAR THUMBNAILS (thumbfast.lua)
# =================================================================
# Upstream: https://github.com/po5/thumbfast (MPL-2.0)
# Tethys asks thumbfast for a frame only while the seekbar is hovered.
# One hidden mpv does the decoding; nothing is pre-generated or cached.
# =================================================================

# Thumbnail size in pixels (scaled down to fit, keeps aspect).
# 256 matches Tethys's thumbnailSize (16:9 -> 256x144).
max_width=256
max_height=256

# Apply tone-mapping for HDR sources, no to disable
tone_mapping=auto

# Overlay id (must not collide with other scripts' overlay-add ids)
overlay_id=42

# Start the background mpv on file load instead of first hover.
# no = zero cost until you actually hover the seekbar.
spawn_first=no

# Close the background mpv after this many idle seconds (0 = never).
# Frees its memory when you stop scrubbing; next hover respawns it (~0.3 s).
quit_after_inactivity=300

# Thumbnails for streams (YouTube etc.). Off: the background mpv would
# re-download parts of the stream through yt-dlp, costing data and CPU.
network=no

# Thumbnails for audio files with cover art
audio=no

# Hardware decoding in the background mpv. Keeps CPU spikes low when
# scrubbing 4K HEVC/AV1.
hwdec=yes

# Windows only: write to the pipe through the WinAPI (requires LuaJIT)
direct_io=yes

# "mpv" resolves to the mpv.exe next to the running player first
# (Windows searches the parent's directory before PATH).
mpv_path=mpv
