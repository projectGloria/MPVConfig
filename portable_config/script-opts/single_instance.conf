# =================================================================
# SINGLE INSTANCE CONFIGURATION
# =================================================================
# Action when opening a video while MPV is already running:
#   replace      - Play the new file immediately (default)
#   append-play  - Enqueue and play if currently stopped/idle
#   append       - Add to playlist without interrupting playback
action=replace

# Unminimize and bring the active MPV window to the front
unminimize=yes