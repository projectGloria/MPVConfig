# =================================================================
# STREAM SEEKBAR THUMBNAILS (storyboard.lua)
# =================================================================
# YouTube serves small sprite sheets ("storyboards") for exactly this.
# They are read from the yt-dlp JSON mpv already fetched, so no extra
# yt-dlp run and no video re-download. Local files keep using thumbfast.
# Live streams have no storyboards: a frame of what you watch is grabbed
# at random moments and kept in memory, so the part you already watched
# gets thumbnails.
# =================================================================

enabled=yes

# On-screen thumbnail size (fit, keeps aspect). Matches thumbfast.conf.
max_width=256
max_height=256

# Overlay id (thumbfast uses 42)
overlay_id=43

# Converted sheets kept in %TEMP% while the file plays (~2 MB each).
# Deleted on file change and on quit.
max_sheets=48

# Sheets on each side of the hovered one to prepare in the background.
prefetch=1

# mpv used to convert sheets. "mpv" resolves to the one next to the player.
mpv_path=mpv

# ---- Live streams ----
live=yes
# A frame is captured after a random gap between these (seconds).
live_min_interval=20
live_max_interval=60
# Show a captured frame only if it is this close to the hovered time.
live_tolerance=60
# Frames kept per stream (~150 KB of RAM each; oldest dropped first).
live_max_frames=120
